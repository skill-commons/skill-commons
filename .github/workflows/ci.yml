name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "skill/*/v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Validate published skills
        run: |
          uv run skill-commons validate skills/starhorse-access --profile agent-skills
          uv run skill-commons validate skills/starhorse-access --profile commons-publication
      - name: Check generated catalog
        run: >-
          uv run skill-commons catalog
          --repository https://github.com/skill-commons/skill-commons
          --check
      - name: Build
        run: uv build --out-dir dist
