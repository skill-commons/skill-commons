stages:
  - test

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:85d4cb1afa769a7338e095b927bee941cf5ec92266c7424b3f6c0f2748567248
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

test:
  stage: test
  script:
    - uv sync --locked --all-groups
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest --junitxml=junit.xml
    - uv run skill-commons catalog --check
    - uv build --out-dir dist
  artifacts:
    when: always
    reports:
      junit: junit.xml
