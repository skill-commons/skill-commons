[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "research-skill-commons"
version = "0.3.0"
description = "Federated discovery catalog for research skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Skill Commons contributors" }]
dependencies = [
  "pyyaml>=6,<7",
]

[project.scripts]
skill-commons = "skill_commons.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_commons"]

[tool.hatch.build.targets.sdist]
exclude = ["/.pytest_cache", "/.ruff_cache", "/.uv-cache", "/.venv", "/dist", "/warehouse"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["warehouse"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
