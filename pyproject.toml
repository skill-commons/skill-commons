[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "research-skill-commons"
version = "0.1.0.dev0"
description = "Git-first hub and reference tooling for reusable research Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Skill Commons contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "license-expression>=30.4,<31",
  "packaging>=24,<27",
  "pyyaml>=6,<7",
  "rfc8785==0.1.4",
  "skills-ref==0.1.1",
]

[project.scripts]
skill-commons = "skill_commons.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_commons"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.pytest_cache",
  "/.ruff_cache",
  "/.uv-cache",
  "/.venv",
  "/dist",
  "/junit.xml",
  "/warehouse",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "skill_commons/schemas"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["warehouse"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
