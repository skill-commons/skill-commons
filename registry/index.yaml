consolidations:
- name: cold-streams-monitoring
  replacement: arxiv
  reason: A topic-specific arXiv query and scheduler wrapper is covered by generic monitoring.
- name: iterative-paper-improvement
  replacement: latex-research-paper
  reason: Its revision rounds duplicate the canonical manuscript workflow.
- name: latex-paper-iteration
  replacement: latex-research-paper
  reason: Drafting, revision, merging, figures, and compile loops belong in one authoring skill.
- name: multi-section-latex-whitepaper
  replacement: latex-research-paper
  reason: Multi-source synthesis is a mode of the canonical manuscript workflow.
- name: mnras-latex-compile-portability-fixes
  replacement: latex-journal-submission-package
  reason: MNRAS portability fixes are packaging guidance, not a separate task.
- name: mnras-latex-portable
  replacement: latex-journal-submission-package
  reason: MNRAS build guidance is consolidated into the journal submission skill.
- name: mnras-latex-portable-build-and-package
  replacement: latex-journal-submission-package
  reason: This duplicated the canonical journal build and submission workflow.
- name: cmd-plotting
  replacement: astro-catalog-plotting-cache
  reason: A color-magnitude diagram is one plot type in the broader astronomy plotting skill.
- name: datashader-019-pipeline
  replacement: astro-catalog-plotting-cache
  reason: Datashader is one implementation path in the broader catalog plotting workflow.
- name: gaia-dr3-daiquiri-rest
  replacement: gaia-dr3-tap-query
  reason: Daiquiri REST is retained as a fallback in the canonical Gaia access skill.
- name: gaia-dr3-plot-with-dust
  replacement: astro-catalog-plotting-cache
  reason: One Gaia sample and dust-overlay figure is too narrow to be an independent skill.
- name: rave-dr6-nearest-100-plot
  replacement: rave-dr6
  reason: A fixed nearest-100 query is an example, not a distinct RAVE capability.
- name: rave-dr6-public-talk-visualizations
  replacement: astro-catalog-plotting-cache
  reason: Presentation styling is a plotting choice independent of the RAVE data source.
- name: rave-dr6-recent-observations-plot
  replacement: rave-dr6
  reason: A fixed newest-100 query and plot is covered by general RAVE querying and plotting.
- name: rave-dr6-shboost-distance-query
  replacement: rave-dr6
  reason: The reusable RAVE-StarHorse crossmatch is part of the canonical RAVE skill.
- name: rave-dr6-starhorse-access
  replacement: rave-dr6
  reason: This was a second version of the same RAVE-StarHorse crossmatch workflow.
- name: hdf5-on-s3-cached
  replacement: data-aip-de-s3
  reason: Cache-first HDF5 handling is one path within general object-store access.
- name: s3-parquet-sampling
  replacement: data-aip-de-s3
  reason: Parquet projection, reduction, and caching are core object-store operations.
- name: s3-parquet-sampling-plot-cached
  replacement: data-aip-de-s3
  reason: S3 access belongs here; astronomy plotting belongs in the plotting skill.
